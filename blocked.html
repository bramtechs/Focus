<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus — Stay on track</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .wrap { max-width: 520px; width: 100%; text-align: center; }
    .big { font-size: 56px; }
    h1 { margin: 8px 0; }
    .buttons { display: grid; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap card">
    <div class="big">🎯</div>
    <h1>Focus blocked this page</h1>
    <p><b id="domain">this site</b> was classified as <span class="pill bad">distracting</span></p>
    <p class="muted" id="detail"></p>
    <div class="buttons">
      <button id="back">← Go back to work</button>
      <button id="proceed" class="secondary">Continue anyway (allow once)</button>
      <button id="allow" class="secondary">Always allow this domain</button>
      <button id="settings" class="secondary">⚙️ Focus settings</button>
    </div>
    <p class="muted" style="margin-top:12px">Classified by TypeSafe Jev (System One) via OpenRouter Decisions API.</p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>

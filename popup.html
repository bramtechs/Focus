<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { width: 320px; padding: 12px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .domain { font-weight: 700; word-break: break-all; }
    .actions { display: grid; gap: 8px; margin-top: 12px; }
    .switch-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎯 Focus</h1>
    <div class="muted">Jev (System One) distraction blocker via OpenRouter</div>
    <div style="margin-top:10px">
      <div class="muted">Current site</div>
      <div class="domain" id="domain">(unknown)</div>
      <div style="margin-top:6px"><span class="pill warn" id="verdict">checking…</span></div>
      <div class="muted" id="detail" style="margin-top:6px"></div>
    </div>
    <div class="switch-row">
      <span>Blocking enabled</span>
      <input type="checkbox" id="enabled" />
    </div>
    <div class="actions">
      <button id="allow">Always allow this domain</button>
      <button id="block" class="danger">Always block this domain</button>
      <button id="recheck" class="secondary">Re-check with Jev</button>
      <button id="options" class="secondary">⚙️ Settings &amp; API key</button>
    </div>
    <div class="muted" id="keyStatus" style="margin-top:10px"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

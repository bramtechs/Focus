<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus DNS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
  <style>
    /* Same palette as the Focus extension (styles.css). */
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
    }
    main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 14px; margin: 0 0 4px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; }
    .muted { color: var(--muted); font-size: 13px; }
    .status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .status-label { font-size: 28px; font-weight: 700; }
    .pill { font-variant-numeric: tabular-nums; display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pill.good { background: rgba(34,197,94,.15); color: var(--good); }
    .pill.bad { background: rgba(239,68,68,.15); color: var(--bad); }
    .pill.warn { background: rgba(245,158,11,.15); color: var(--warn); }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      background: var(--accent); color: white; border: 0; border-radius: 8px;
      padding: 9px 14px; cursor: pointer; font-size: 14px; font: inherit;
    }
    button.secondary { background: var(--line); }
    button.danger { background: var(--bad); }
    button:disabled { opacity: .5; cursor: default; }
    .modes { display: grid; gap: 8px; margin-top: 8px; }
    .mode {
      display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    }
    .mode:has(input:checked) { border-color: var(--accent); background: rgba(99,102,241,.1); }
    .mode input { margin-top: 3px; accent-color: var(--accent); }
    .mode b { display: block; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
    #error { color: var(--bad); font-size: 13px; min-height: 1em; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🎯 Focus DNS</h1>
      <div class="muted">Network-wide distraction blocking, powered by Jev.</div>
    </header>

    <section class="card">
      <div class="status">
        <span class="status-label" id="statusLabel">…</span>
        <span class="pill" id="statusPill"></span>
      </div>
      <div class="muted" id="statusDetail" style="margin-top:6px"></div>
      <div class="buttons">
        <button id="enable">Turn on</button>
        <button id="disable" class="danger">Turn off</button>
      </div>
    </section>

    <section class="card">
      <h2>Focus session</h2>
      <div class="muted">Block for a while, then switch blocking off automatically.</div>
      <div class="buttons" id="focusButtons">
        <button class="secondary" data-minutes="15">15 min</button>
        <button class="secondary" data-minutes="30">30 min</button>
        <button class="secondary" data-minutes="60">1 hour</button>
        <button class="secondary" data-minutes="120">2 hours</button>
        <button class="danger" id="endFocus" hidden>End session</button>
      </div>
    </section>

    <section class="card">
      <h2>New domains</h2>
      <div class="muted">What to do the first time a device looks up a domain that hasn't been classified yet.</div>
      <form class="modes" id="modes">
        <label class="mode">
          <input type="radio" name="mode" value="wait" />
          <span><b>Wait for Jev</b><span class="muted">Hold the lookup up to <span id="waitMs">1.5 s</span> for a verdict. If Jev is slower, allow it this time.</span></span>
        </label>
        <label class="mode">
          <input type="radio" name="mode" value="background" />
          <span><b>Allow now, classify in background</b><span class="muted">Never slows lookups. A distracting site loads once, then gets blocked.</span></span>
        </label>
        <label class="mode">
          <input type="radio" name="mode" value="offline" />
          <span><b>Lists only</b><span class="muted">No Jev calls: your allow/block lists, the built-in list and earlier verdicts.</span></span>
        </label>
      </form>
    </section>

    <section class="card">
      <div class="stats">
        <div class="stat"><b id="queries">0</b><span class="muted">queries</span></div>
        <div class="stat"><b id="blocked">0</b><span class="muted">blocked</span></div>
        <div class="stat"><b id="classified">0</b><span class="muted">classified</span></div>
      </div>
      <div class="muted" id="info" style="margin-top:12px"></div>
    </section>

    <div id="error" role="alert"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let current = null;
    let fetchedAt = 0;

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
      return res.json();
    }

    async function act(method, path, body) {
      try {
        render(await api(method, path, body));
        $("error").textContent = "";
      } catch (e) {
        $("error").textContent = `Couldn't update: ${e.message}`;
      }
    }

    function formatRemaining(ms) {
      const s = Math.max(0, Math.round(ms / 1000));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      const mm = String(m).padStart(h ? 2 : 1, "0"), ss = String(sec).padStart(2, "0");
      return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function render(data) {
      current = data;
      fetchedAt = Date.now();
      const { status } = data;
      const label = { on: "Blocking on", off: "Blocking off", focus: "Focus session" }[status.kind];
      $("statusLabel").textContent = label;
      $("statusPill").className = "pill " + (status.kind === "off" ? "bad" : status.kind === "focus" ? "warn" : "good");
      $("enable").disabled = status.kind === "on";
      $("disable").disabled = status.kind === "off";
      $("endFocus").hidden = status.kind !== "focus";
      tick();

      for (const input of document.querySelectorAll("input[name=mode]")) {
        input.checked = input.value === data.newDomainMode;
      }
      $("waitMs").textContent = `${(data.waitTimeoutMs / 1000).toFixed(1)} s`;
      $("queries").textContent = data.stats.queries.toLocaleString();
      $("blocked").textContent = data.stats.blocked.toLocaleString();
      $("classified").textContent = data.stats.classified.toLocaleString();
      $("info").textContent =
        (data.hasApiKey ? `Model ${data.model}` : "No OpenRouter API key: offline list only") +
        ` · upstream ${data.upstreams.join(", ")}`;
    }

    function tick() {
      if (!current) return;
      const { status } = current;
      if (status.kind === "focus") {
        const left = status.remainingMs - (Date.now() - fetchedAt);
        if (left <= 0) return refresh();
        const end = new Date(status.focusUntil).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        $("statusDetail").textContent = `Distracting sites are blocked until ${end}, then blocking turns off.`;
        $("statusPill").textContent = formatRemaining(left);
      } else {
        $("statusPill").textContent = status.kind === "on" ? "until turned off" : "nothing blocked";
        $("statusDetail").textContent =
          status.kind === "on" ? "Distracting sites are blocked on every device using this DNS server." : "All lookups are passed through.";
      }
    }

    async function refresh() {
      try {
        render(await api("GET", "/api/status"));
        $("error").textContent = "";
      } catch (e) {
        $("error").textContent = `Can't reach Focus DNS: ${e.message}`;
      }
    }

    $("enable").onclick = () => act("PUT", "/api/enabled", { enabled: true });
    $("disable").onclick = () => act("PUT", "/api/enabled", { enabled: false });
    $("endFocus").onclick = () => act("DELETE", "/api/focus");
    for (const b of document.querySelectorAll("[data-minutes]")) {
      b.onclick = () => act("POST", "/api/focus", { minutes: Number(b.dataset.minutes) });
    }
    $("modes").onchange = (e) => act("PUT", "/api/mode", { newDomainMode: e.target.value });

    refresh();
    setInterval(tick, 1000);
    setInterval(refresh, 5000);
  </script>
</body>
</html>
